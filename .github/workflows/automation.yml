name: Automation Exercise UI automation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Complete regression or the three previously failing examples
        type: choice
        options: [full, affected]
        default: full
      workers:
        description: CI scenario workers; local default remains two
        type: choice
        options: ['1', '2']
        default: '1'
permissions:
  contents: read
concurrency:
  group: automationexercise-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    env:
      CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
      CI_WORKERS: ${{ inputs.workers || '1' }}
      CI_SCOPE: ${{ inputs.scope || 'full' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17 and Maven dependency cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install pinned Chrome and matching driver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: '155.0.8059.84'
          install-chromedriver: true
      - name: Record Java, Maven and Chrome versions
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_DRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          java -version
          mvn -version
          "$CHROME_BINARY" --version
          "$CHROME_DRIVER" --version
      - name: Record runner capacity and verified HTTPS reachability
        run: |
          mkdir -p "$RUNNER_TEMP/selenium-diagnostics"
          { nproc; free -b; df -B1 /tmp /dev/shm; ulimit -a; } > "$RUNNER_TEMP/selenium-diagnostics/capacity.txt"
          cat "$RUNNER_TEMP/selenium-diagnostics/capacity.txt"
          python3 .github/scripts/ci_diagnostics.py probe "$RUNNER_TEMP/selenium-diagnostics/https-before.json"
      - name: Configure packaged Chrome sandbox helper
        run: |
          test -x "$CHROME_DEVEL_SANDBOX"
          test "$(stat -c '%U' "$CHROME_DEVEL_SANDBOX")" = root
          sudo chmod 4755 "$CHROME_DEVEL_SANDBOX"
          stat -c '%a %U %n' "$CHROME_DEVEL_SANDBOX"
      - name: Diagnose Chrome startup without application traffic
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          mkdir -p "$RUNNER_TEMP/selenium-diagnostics"
          if timeout 20s "$CHROME_BINARY" --headless=new --disable-dev-shm-usage --dump-dom about:blank > "$RUNNER_TEMP/selenium-diagnostics/chrome-startup.log" 2>&1; then
            echo "Chrome preflight succeeded"
          else
            echo "Chrome preflight failed; Maven will still attempt the suite and preserve its exit code"
            cat "$RUNNER_TEMP/selenium-diagnostics/chrome-startup.log"
          fi
      - name: Execute selected scenarios and component checks
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_DRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          python3 .github/scripts/ci_diagnostics.py monitor "$RUNNER_TEMP/selenium-diagnostics/resources.jsonl" &
          MONITOR_PID=$!
          finish_monitor() {
            TEST_EXIT=$?
            trap - EXIT
            if kill -0 "$MONITOR_PID" 2>/dev/null; then
              kill "$MONITOR_PID"
              wait "$MONITOR_PID"
            fi
            exit "$TEST_EXIT"
          }
          trap finish_monitor EXIT
          OPTIONS=()
          if [ "$CI_SCOPE" = "affected" ]; then
            OPTIONS+=("-Dcucumber.features=src/test/resources/features/authentication/authentication.feature:28,src/test/resources/features/cart/cart.feature:16,src/test/resources/features/registration/registration.feature:34")
          fi
          mvn --batch-mode --no-transfer-progress clean test \
            -Dheadless=true -Dbrowser=chrome -Dci.diagnostics=true \
            -Dscenarios.parallel=true -Dthreads="$CI_WORKERS" \
            -Dchrome.binary="$CHROME_BINARY" \
            -Dwebdriver.chrome.driver="$CHROME_DRIVER" "${OPTIONS[@]}"
      - name: Record post-execution HTTPS reachability
        if: always()
        run: python3 .github/scripts/ci_diagnostics.py probe "$RUNNER_TEMP/selenium-diagnostics/https-after.json"
      - name: Validate and summarize actual result categories
        if: always()
        run: |
          jq -e '
            (.liveCucumber.total + .browserComponents.total + .otherTests.total == .totalTestMethods.total)
            and (.totalTestMethods.passed + .totalTestMethods.failed + .totalTestMethods.skipped == .totalTestMethods.total)
            and ((has("cucumberCountsAgree") | not) or .cucumberCountsAgree == true)
          ' target/test-output/execution-summary.json
          jq -r '
            "### Actual TestNG results\n\n| Category | Passed | Failed | Skipped | Total |\n|---|---:|---:|---:|---:|",
            (. as $s | ["liveCucumber", "browserComponents", "otherTests", "totalTestMethods"][] as $k |
              "| \($k) | \($s[$k].passed) | \($s[$k].failed) | \($s[$k].skipped) | \($s[$k].total) |"),
            "\nConfiguration failures: \(.configurationFailures); configuration skips: \(.configurationSkips). Extent covers Cucumber only."
          ' target/test-output/execution-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automationexercise-${{ github.run_number }}-${{ inputs.scope || 'full' }}-${{ inputs.workers || '1' }}worker
          path: |
            target/test-output/
            target/surefire-reports/
            ${{ runner.temp }}/selenium-diagnostics/
          if-no-files-found: warn
          retention-days: 14

